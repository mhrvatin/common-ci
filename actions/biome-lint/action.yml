name: Biome lint
description: >
  Checks out, restores the bun install cache, installs deps with bun, and
  runs Biome — either the repo's full "check" script, or a scoped check
  against a specific file list. Assumes the repo has a `check` script (e.g.
  "biome check .") in package.json and Biome as a devDependency.

inputs:
  bun-version:
    description: Bun version to install (passed to oven-sh/setup-bun)
    required: true
  files:
    description: >
      Space-separated list of changed files to lint. When empty (default),
      runs the full `bun run check` script instead.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    # Restored before setup-bun: under `act`, node-based steps that run after
    # setup-bun can't find `node` on PATH. Order doesn't matter on GitHub.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
        restore-keys: bun-${{ runner.os }}-
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
    - run: bun install --frozen-lockfile
      shell: bash
    - shell: bash
      env:
        FILES: ${{ inputs.files }}
      run: |
        if [ -z "$FILES" ]; then
          bun run check
        else
          ./node_modules/.bin/biome check --no-errors-on-unmatched $FILES
        fi
