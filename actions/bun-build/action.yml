name: Bun build
description: >
  Checks out, installs deps with bun, and runs `bun run --filter <name> build`
  for each package in a space-separated list.

inputs:
  bun-version:
    description: Bun version to install (passed to oven-sh/setup-bun)
    required: true
  packages:
    description: Space-separated list of workspace package names to build
    required: true
  scope:
    description: >
      Prefix prepended to each package name to form the --filter argument
      (e.g. "@facit/" for a workspace scoped under @facit). Leave empty to
      use the bare package names as filters.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
    - run: bun install --frozen-lockfile
      shell: bash
    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        SCOPE: ${{ inputs.scope }}
      run: |
        set -euo pipefail
        for pkg in $PACKAGES; do
          echo "::group::Building $pkg"
          bun run --filter "${SCOPE}${pkg}" build
          echo "::endgroup::"
        done
